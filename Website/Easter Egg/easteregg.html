<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Easter Egg - Tetris</title>
	<link rel="stylesheet" href="easteregg.css">
</head>
<body>
	<div class="egg-shell">
		<header class="egg-header">
			<div>
				<p class="egg-eyebrow">DEEP SPACE RELAY</p>
				<h1>TETRIS OVERRIDE</h1>
			</div>
			<a class="back-link" href="../index.html">Back to Console</a>
		</header>

		<main class="game-layout">
			<section class="game-panel">
				<canvas id="tetris" width="240" height="480"></canvas>
				<div class="game-overlay" id="gameOverlay">Paused</div>
			</section>
			<aside class="info-panel">
				<h2>Mission Stats</h2>
				<div class="stat">
					<span>Score</span>
					<strong id="score">0</strong>
				</div>
				<div class="stat">
					<span>Lines</span>
					<strong id="lines">0</strong>
				</div>
				<div class="stat">
					<span>Level</span>
					<strong id="level">1</strong>
				</div>
				<button class="new-game" id="newGameBtn" type="button">New Game</button>
				<div class="controls">
					<p>Controls</p>
					<ul>
						<li>Left / Right: Move</li>
						<li>Up: Rotate</li>
						<li>Down: Soft drop</li>
						<li>Space: Hard drop</li>
						<li>P: Pause</li>
					</ul>
				</div>
			</aside>
		</main>
	</div>

	<script src="easteregg.js"></script>
</body>
</html>
